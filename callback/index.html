<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening VivaPantry</title>
  <meta name="description" content="Opening VivaPantry to finish sign in." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/Mainicon.png" />
  <link rel="apple-touch-icon" href="/assets/Mainicon.png" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fbfaf8;
      color: #111827;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #dde7df;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(20, 83, 45, 0.12);
    }

    img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }

    h1 {
      margin: 24px 0 10px;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.6;
      color: #4b5563;
    }

    a {
      display: inline-flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #14532d;
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/Mainicon.png" alt="" />
    <h1>Opening VivaPantry</h1>
    <p>If the app does not open automatically, tap the button below to finish confirming your email.</p>
    <a id="open-app" href="vivapantry://callback">Open VivaPantry</a>
  </main>
  <script>
    (function () {
      var payload = (window.location.search || '') + (window.location.hash || '');
      var appUrl = 'vivapantry://callback' + payload;
      var legacyUrl = 'pantrypal://callback' + payload;
      var openButton = document.getElementById('open-app');

      openButton.setAttribute('href', appUrl);
      window.location.replace(appUrl);

      window.setTimeout(function () {
        window.location.href = legacyUrl;
      }, 900);
    })();
  </script>
</body>
</html>
